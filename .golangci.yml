version: "2"

linters:
  disable-all: true
  enable:
    - bidichk
    - errcheck
    - govet
    - ineffassign
    - makezero
    - misspell
    # - revive  # Disabled for now - will enable specific rules in future PR
    - staticcheck
    - unconvert
    - unused
    - whitespace

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Exclude test files from certain checks
    - path: _test\.go
      linters:
        - errcheck
        - unused
    # Exclude generated files
    - path: mock_.*\.go
      linters:
        - revive
        - staticcheck
    # Exclude test helper files from errcheck
    - path: test/.*\.go
      linters:
        - errcheck

run:
  timeout: 5m
  tests: true
  build-tags: []
  skip-dirs:
    - vendor
    - third_party

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
